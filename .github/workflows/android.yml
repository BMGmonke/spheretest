name: Legacy Android APK (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [android-arm64-ci]
    paths:
      - 'build/android/**'
      - '.github/workflows/android.yml'
      - 'src/**'
      - 'builtin/**'
      - 'games/**'
      - 'textures/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out SphereTest
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake automake autoconf libtool pkg-config \
            wget curl unzip zip subversion git bzip2 lib32stdc++6 autotools-dev xutils-dev

      - name: Install Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 23 and legacy NDK r11c (ARM64 target)
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-23" "build-tools;23.0.3" "build-tools;35.0.0"
          mkdir -p "$ANDROID_HOME/ndk"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 30 \
            https://dl.google.com/android/repository/android-ndk-r11c-linux-x86_64.zip \
            -o /tmp/android-ndk-r11c.zip
          unzip -q /tmp/android-ndk-r11c.zip -d "$ANDROID_HOME/ndk"
          LEGACY_NDK="$ANDROID_HOME/ndk/android-ndk-r11c"
          test -x "$LEGACY_NDK/ndk-build"
          echo "ANDROID_NDK=$LEGACY_NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$LEGACY_NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$LEGACY_NDK" >> "$GITHUB_ENV"

      - name: Switch to Java 8 for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 2.10
        shell: bash
        run: |
          curl -fL --retry 3 --retry-all-errors --connect-timeout 30 \
            https://services.gradle.org/distributions/gradle-2.10-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-2.10/bin" >> "$GITHUB_PATH"

      - name: Configure legacy Android project
        working-directory: build/android
        run: |
          printf 'sdk.dir=%s\nndk.dir=%s\n' "$ANDROID_HOME" "$ANDROID_NDK" > local.properties
          chmod +x "$ANDROID_NDK/ndk-build"

      - name: Build SphereTest Android APK
        working-directory: build/android
        env:
          VERSION_STR: 0.4.14
        run: |
          set -euo pipefail
          make release

      - name: Align, sign, and verify ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching the Android project for the generated APK..."
          find build/android -type f -path '*/outputs/apk/*' -name '*.apk' -print
          APK="$(find build/android -type f -path '*/outputs/apk/*' -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Gradle reported success, but no APK exists under build/android/**/outputs/apk/."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          # Refuse to publish an APK that is not actually 64-bit ARM.
          if ! unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "::error::APK does not contain arm64-v8a native libraries."
            exit 1
          fi

          mkdir -p artifacts
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/SphereTest-aligned.apk"

          # A temporary CI key signs this sideload build. A persistent key can
          # be supplied later through GitHub Actions secrets for seamless updates.
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/spheretest-ci.jks" \
            -storepass "spheretest-ci-store" -keypass "spheretest-ci-key" \
            -alias spheretest -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SphereTest CI, OU=Android, O=BMGmonke, C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/spheretest-ci.jks" \
            --ks-key-alias spheretest \
            --ks-pass pass:spheretest-ci-store \
            --key-pass pass:spheretest-ci-key \
            --out artifacts/SphereTest-Android-ARM64.apk \
            "$RUNNER_TEMP/SphereTest-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/SphereTest-Android-ARM64.apk
          unzip -t artifacts/SphereTest-Android-ARM64.apk
          echo "Signed ARM64 APK:"
          ls -lh artifacts/SphereTest-Android-ARM64.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spheretest-android-arm64
          path: artifacts/SphereTest-Android-ARM64.apk
          if-no-files-found: error
          retention-days: 14
