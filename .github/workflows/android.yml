name: Legacy Android APK (ARMv7)

on:
  workflow_dispatch:
  push:
    branches: [android-armv7-ci]
    paths:
      - 'build/android/**'
      - '.github/workflows/android.yml'
      - 'src/**'
      - 'builtin/**'
      - 'games/**'
      - 'textures/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out SphereTest
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake automake autoconf libtool pkg-config \
            wget curl unzip zip subversion git bzip2 lib32stdc++6

      # Current Android command-line tools require JDK 17.
      - name: Install Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the removed SDK package named 'tools'.
          packages: 'platform-tools'

      - name: Install Android SDK 23 and legacy NDK r11c
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-23" "build-tools;23.0.3"
          mkdir -p "$ANDROID_HOME/ndk"
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r11c-linux-x86_64.zip \
            -o /tmp/android-ndk-r11c.zip
          unzip -q /tmp/android-ndk-r11c.zip -d "$ANDROID_HOME/ndk"
          LEGACY_NDK="$ANDROID_HOME/ndk/android-ndk-r11c"
          test -x "$LEGACY_NDK/ndk-build"
          # setup-android exports ANDROID_NDK_ROOT for its modern NDK. This
          # legacy project invokes ndk-build via ANDROID_NDK but libiconv's
          # configure script reads ANDROID_NDK_ROOT, so point both at r11c.
          echo "ANDROID_NDK=$LEGACY_NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$LEGACY_NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$LEGACY_NDK" >> "$GITHUB_ENV"

      # This project's Gradle 2.10 / Android Gradle Plugin 1.5.0 need Java 8.
      - name: Switch to Java 8 for legacy Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 2.10
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-2.10-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-2.10/bin" >> "$GITHUB_PATH"

      - name: Configure legacy Android project
        working-directory: build/android
        run: |
          printf 'sdk.dir=%s\nndk.dir=%s\n' "$ANDROID_HOME" "$ANDROID_NDK" > local.properties
          chmod +x "$ANDROID_NDK/ndk-build"

      - name: Build SphereTest Android APK
        working-directory: build/android
        env:
          VERSION_STR: 0.4.14
        run: |
          make release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spheretest-android-armv7
          path: build/android/build/outputs/apk/Minetest-release.apk
          if-no-files-found: error
          retention-days: 14
